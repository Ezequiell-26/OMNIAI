name: OMNIAI Quality Gate

on:
  push:
    branches: [main, web, windows-app]
  pull_request:
    branches: [main, web, windows-app]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Architecture guard
        run: bun run verify:architecture

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
